apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustant-ing
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: trustant.$DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trustable-svc
                port:
                  number: 8910
  #tls:
  #  - hosts:
  #      - trustant.$DOMAIN
---
