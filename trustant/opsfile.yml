version: "3"

vars:
  ACTION: "apply"
  KEY: "trustant"
  EXTRA: ""
  UID:
    sh: 'echo {{ if eq OS "windows" }}1000{{ else }}$(id -u){{ end }}'
  GID:
    sh: 'echo {{ if eq OS "windows" }}1000{{ else }}$(id -g){{ end }}'

  ENTRY: trustant
  SSHDIR:
    sh: |
        echo ~/.ssh | replace -s \\ -r / --stdin
  SSHKEY:
    sh: |
        echo {{.SSHDIR}}/id_trustant

  INGRESS:
    sh: ops util ingress

env:
  TIKA_IMAGE: docker.io/apache/tika:3.2.3.0-full
  KUBECONFIG:
    sh: |-
      if test -e "$OPS_TMP/kubeconfig"
      then echo "$OPS_TMP/kubeconfig"
      else echo ~/.kube/config
      fi

tasks:

  info:
    silent: true
    cmds:
    - echo 'Trustant Image:' "${TRUINST_IMAGES_TRUSTANT}"

  expose-external:
    silent: true
    desc: remove Trustant .deb k3s HTTP/HTTPS external visibility block
    cmds:
    - |
      set -e
      DROPIN="/etc/systemd/system/k3s.service.d/blockports.conf"
      CNI_PATH_DROPIN="/etc/systemd/system/k3s.service.d/truinst-cni-path.conf"
      IPTABLES="$(command -v iptables || true)"
      IFACE=""
      NEEDS_RESTART="false"
      if test -f "${DROPIN}"; then
        IFACE="$(sed -n 's/.* -i \([^ ]*\) .*/\1/p' "${DROPIN}" | head -1)"
        if grep -q -- '--dports 80,443' "${DROPIN}"; then
          NEEDS_RESTART="true"
        fi
      fi
      test -n "${IFACE}" || IFACE="$(ip -4 route show default 2>/dev/null | awk '{print $5; exit}')"

      remove_rule() {
        iface="$1"
        ports="$2"
        test -n "${IPTABLES}" || return 0
        test -n "${iface}" || return 0
        while sudo "${IPTABLES}" -t raw -C PREROUTING -i "${iface}" -p tcp -m multiport --dports "${ports}" -j DROP >/dev/null 2>&1; do
          sudo "${IPTABLES}" -t raw -D PREROUTING -i "${iface}" -p tcp -m multiport --dports "${ports}" -j DROP >/dev/null 2>&1 || break
        done
      }

      if test -n "${IFACE}"; then
        remove_rule "${IFACE}" "80,443,6443"
        remove_rule "${IFACE}" "80,443"
      fi

      if test -n "${IFACE}" && test -n "${IPTABLES}"; then
        sudo mkdir -p /etc/systemd/system/k3s.service.d
        {
          printf '%s\n' '[Service]'
          printf '%s\n' "ExecStartPre=/bin/sh -c '${IPTABLES} -t raw -C PREROUTING -i ${IFACE} -p tcp -m multiport --dports 6443 -j DROP 2>/dev/null || ${IPTABLES} -t raw -I PREROUTING -i ${IFACE} -p tcp -m multiport --dports 6443 -j DROP'"
          printf '%s\n' "ExecStopPost=/bin/sh -c '${IPTABLES} -t raw -D PREROUTING -i ${IFACE} -p tcp -m multiport --dports 6443 -j DROP 2>/dev/null || true'"
        } | sudo tee "${DROPIN}" >/dev/null
        sudo "${IPTABLES}" -t raw -C PREROUTING -i "${IFACE}" -p tcp -m multiport --dports 6443 -j DROP >/dev/null 2>&1 \
          || sudo "${IPTABLES}" -t raw -I PREROUTING -i "${IFACE}" -p tcp -m multiport --dports 6443 -j DROP >/dev/null 2>&1 \
          || true
      else
        sudo rm -f "${DROPIN}" >/dev/null 2>&1 || true
      fi

      if test -d /var/lib/rancher/k3s/data/current/bin; then
        sudo mkdir -p /etc/systemd/system/k3s.service.d
        {
          printf '%s\n' '[Service]'
          printf '%s\n' 'Environment="PATH=/var/lib/rancher/k3s/data/current/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'
        } | sudo tee "${CNI_PATH_DROPIN}" >/dev/null
      fi

      sudo systemctl daemon-reload >/dev/null 2>&1 || true
      if command -v systemctl >/dev/null 2>&1; then
        if systemctl is-active --quiet k3s && test "${NEEDS_RESTART}" = "true"; then
          echo "Restarting k3s after external visibility patch..."
          sudo systemctl restart k3s
        elif ! systemctl is-active --quiet k3s; then
          echo "Starting k3s after external visibility patch..."
          sudo systemctl start k3s
        fi
      fi

      if command -v kubectl >/dev/null 2>&1; then
        for _ in $(seq 1 120); do
          kubectl get node trustant >/dev/null 2>&1 && break
          sleep 2
        done
      fi
      echo "OpenServerless external HTTP/HTTPS visibility enabled; k3s API port 6443 remains blocked on ${IFACE:-default interface}."


  kube-config:
    silent: true
    desc: generate the kubeconfig secret to access the cluster internally
    cmds:
    #- cat $KUBECONFIG
    - >
      cat "$KUBECONFIG"
      | replace -s 'server: .*$' --stdin --regex
      -r 'server: https://kubernetes.default.svc.cluster.local'
      > _kubeconfig
    #- cat _kubeconfig
    - kubectl -n openserverless delete secret kube-secret 2>/dev/null || true
    - |
      export K64=$(ops -base64 -e "$(cat _kubeconfig)")
      if test -n "$K64"
      then kubectl -n openserverless create secret generic kube-secret --from-literal=kubeconfig="$K64"
      fi

  ingress:
    silent: true
    desc: deploy the ingress
    env:
      DOMAIN:
        sh: ops util kubeget cm/config .metadata.annotations.apihost | ops -replace -s 'https?://' -r '' --regex --stdin
    cmds:
      - |
        envsubst -i {{.INGRESS}}.yaml -o _ingress.yaml
        kubectl -n openserverless {{.ACTION}} -f _ingress.yaml

  config:
    silent: true
    desc: configurations for miniops
    cmds:
      - |
        case {{.INGRESS}} in
          traefik) export INGRESS_SVC=traefik.kube-system.svc.cluster.local ;;
          nginx) export INGRESS_SVC=ingress-nginx-controller.ingress-nginx.svc.cluster.local ;;
          *) die "unknown service type" ;;
        esac
        envsubst -i nginx.conf -o _nginx.conf
        envsubst -i coredns.yaml -o _coredns.yaml
      - kubectl -n openserverless create configmap nginx-proxy-config --from-file=nginx.conf=_nginx.conf || true
      - kubectl -n kube-system apply -f _coredns.yaml
      - kubectl -n kube-system rollout restart deployment coredns

  sts:
    silent: true
    desc: deploy the sts in kubernetes
    cmds:
      - test -n "${TRUINST_IMAGES_TRUSTANT}" || die "missing trustant image"
      # Migrate a pre-rebrand install before the StatefulSet is applied: the
      # hostPath moved from /home/trustant/workspace to /home/trustant, and
      # the volume holds all user data. usermod -m preserves the uid/gid and
      # moves the home, so ownership inside the volume stays valid. Idempotent
      # by construction -- if the trustant user already exists there is nothing
      # to do, and a rerun after a partial move finds only the new name.
      - |
        if ! id trustant >/dev/null 2>&1 && id trustable >/dev/null 2>&1
        then
          echo "Migrating user trustable -> trustant (preserving uid/gid and data)"
          sudo usermod -l trustant -d /home/trustant -m trustable
          sudo groupmod -n trustant trustable || true
        fi
      - |
        export IMAGE="${TRUINST_IMAGES_TRUSTANT}"
        if id trustant
        then
          export USERID="$(id -u trustant)"
          export GROUPID="$(id -g trustant)"
          sudo mkdir -p /home/trustant/workspace
          sudo chown -Rvf "$USERID:$GROUPID" /home/trustant/workspace
        else
          echo "No user trustant - this is the development environment"
          echo "Using defaults and assuming directory properly configured"
          export USERID=769
          export GROUPID=769
        fi
        envsubst <sts.yaml >_sts.yaml
      - kubectl -n openserverless {{.ACTION}} -f _sts.yaml

  tika:
    desc: deploy tika
    cmds:
      - envsubst -i tika.yaml -o _tika.yaml
      - kubectl -n openserverless {{.ACTION}} -f _tika.yaml
      - ops setup kubernetes wait OBJECT=po/tika-0 COND=true

  deploy:
    silent: true
    desc: setup trustant
    cmds:
      # this must be invoked by the installer
      #- task: expose-external
      - task: tika
      - task: config
      - task: kube-config
      - task: ingress
      - task: sts
      - ops setup kubernetes wait OBJECT=po/trustant-0 COND=true
      - echo "Trustant image deployed:"
      - kubectl -n openserverless get po trustant-0 -o jsonpath='{.spec.containers[?(@.name=="trustant")].image}'

  undeploy:
    silent: true
    desc: uninstall trustant
    ignore_error: true
    cmds:
      # The second line holds the PRE-RENAME object names. They stay listed so
      # upgrading a cluster that still runs them removes them instead of
      # orphaning them; the task is ignore_error, so deleting names that are
      # already gone is a no-op. Drop that line once no deployed cluster
      # predates the trustant rename.
      - >
        kubectl -n openserverless delete
        sts/trustant svc/trustant-svc cm/nginx-proxy-config
        ing/trustant-ing ing/truacp-ing ing/vite-ing
        secret/kube-secret svc/trustant-ssh
        sts/trustable svc/trustable-svc svc/trustable-ssh
        ing/trustable-ing ing/opencode-ing
        sts/tika svc/tika cm/tika-config


  redeploy:
    silent: true
    desc: redeploy trustant
    cmds:
    - task: undeploy
    - task: deploy

  doctor:
    silent: true
    desc: validate Trustant runtime deployed by the OpenServerless installer
    cmds:
    - |
      test -d /home/trustant/workspace || die "Missing /home/trustant/workspace"
      OWNER="$(stat -c '%u:%g' /home/trustant/workspace 2>/dev/null || stat -f '%u:%g' /home/trustant/workspace 2>/dev/null || true)"
      test "${OWNER}" = "1000:1000" || die "Unexpected /home/trustant/workspace ownership: ${OWNER:-unknown}, expected 1000:1000"
      kubectl -n openserverless get pod/trustant-0 >/dev/null 2>&1 || die "Missing pod openserverless/trustant-0"
      kubectl -n openserverless get svc/trustant-svc >/dev/null 2>&1 || die "Missing service openserverless/trustant-svc"
      kubectl -n openserverless get ing/trustant-ing ing/truacp-ing ing/vite-ing >/dev/null 2>&1 || die "Missing Trustable ingresses"
      kubectl -n ingress-nginx get deploy/default-nginx svc/default-nginx ing/default-nginx-catchall >/dev/null 2>&1 || die "Missing OpenServerless proxy/catch-all"
      kubectl -n openserverless get svc/ollama >/dev/null 2>&1 || die "Missing Ollama k3s service"
      if test -f /etc/systemd/system/k3s.service.d/blockports.conf && grep -q -- '--dports 80,443' /etc/systemd/system/k3s.service.d/blockports.conf; then
        die "k3s external HTTP/HTTPS block is still active in blockports.conf"
      fi
      echo "Trustable runtime looks ready."
