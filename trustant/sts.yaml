apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trustant
spec:
  serviceName: trustant
  replicas: 1
  selector:
    matchLabels:
      app: trustant
  template:
    metadata:
      labels:
        app: trustant
    spec:
      hostname: trustant
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      volumes:
      - name: workspace
        hostPath:
          path: /home/trustant/workspace
      - name: nginx-config
        configMap:
          name: nginx-proxy-config
      containers:
      - name: trustant
        image: $IMAGE
        #command: ["tail", "-f", "/dev/null"]
        ports:
        - containerPort: 2222
          name: ssh
          protocol: TCP
        - containerPort: 8910
          name: web
          protocol: TCP
        - containerPort: 4096
          name: opencode
          protocol: TCP
        - containerPort: 5173
          name: vite
          protocol: TCP
        volumeMounts:
        - name: workspace
          mountPath: /home/trustant/workspace
        env:
        - name: DEBIAN_FRONTEND
          value: noninteractive
        - name: USERID
          value: "$USERID"
        - name: GROUPID
          value: "$GROUPID"
        - name: B64KUBECONFIG
          valueFrom:
            secretKeyRef:
              name: kube-secret
              key: kubeconfig
      - name: reverse-proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        command: ["nginx", "-g", "daemon off;"]
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: trustant-ssh
  labels:
    app: trustant
spec:
  type: NodePort
  selector:
    app: trustant
  ports:
  - port: 2222
    targetPort: 2222
    nodePort: 30222
    protocol: TCP
    name: ssh
---
apiVersion: v1
kind: Service
metadata:
  name: trustant-svc
spec:
  selector:
    app: trustant
  type: ClusterIP
  ports:
    - name: web
      port: 8910
      targetPort: 8910
    - name: opencode
      port: 4096
      targetPort: 4096
    - name: vite
      port: 5173
      targetPort: 5173
